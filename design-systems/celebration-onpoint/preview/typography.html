<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celebration OnPoint typography</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-12) var(--space-6); display: grid; gap: var(--space-8); }
    .display { font-family: var(--font-display); letter-spacing: var(--tracking-display); line-height: var(--leading-tight); margin: 0; }
    .t4 { font-size: var(--text-4xl); font-weight: 700; }
    .t3 { font-size: var(--text-3xl); font-weight: 700; }
    .t2 { font-size: var(--text-2xl); font-weight: 600; }
    .tl { font-size: var(--text-lg); }
    .meta { color: var(--muted); font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.14em; text-transform: uppercase; }
    p { margin: 0; max-width: 40rem; line-height: var(--leading-body); }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="meta">Display — Poppins</p>
      <p class="display t4">We build momentum.</p>
      <p class="display t3">Real. Measurable. Unstoppable.</p>
      <p class="display t2">Message · Machines · Mission</p>
    </div>
    <div>
      <p class="meta">Body — Open Sans</p>
      <p class="tl">Unify Message, Machines, and Mission so organizations can see more, sell more, and operate smarter.</p>
    </div>
    <div>
      <p class="meta">Mono — IBM Plex Mono</p>
      <p>+38% &nbsp; $2.1M &nbsp; 3.4×</p>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celebration OnPoint Light Fields</title>
  <link rel="stylesheet" href="../../../packages/tokens/styles.css">
  <style>
    body { margin: 0; background: var(--c-ink); color: var(--n-0); font-family: var(--font-body); }
    main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-12) var(--space-6); }
    h1 { font-family: var(--font-display); letter-spacing: var(--ls-tight); }
    p { color: rgba(255,255,255,0.7); max-width: 42rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-5); }
    .tile { position: relative; overflow: hidden; min-height: 220px; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.1); }
    .label { position: relative; padding: var(--space-4); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-gold); }
  </style>
</head>
<body>
  <main>
    <h1>Light Fields</h1>
    <p>Cool light from the left, warm gold from the right, over ink, pooling on the floor. CSS treatments work without plates. Photographic plates use <code>.cop-lf-plate--*</code> once the originals sit in <code>packages/tokens/assets/lightfields/</code>.</p>
    <div class="grid">
      <div class="tile"><div class="cop-lightfield cop-lf--pillars" aria-hidden="true"></div><div class="label">pillars</div></div>
      <div class="tile"><div class="cop-lightfield cop-lf--horizon" aria-hidden="true"></div><div class="label">horizon</div></div>
      <div class="tile"><div class="cop-lightfield cop-lf--aurora" aria-hidden="true"></div><div class="label">aurora</div></div>
      <div class="tile"><div class="cop-lightfield cop-lf--purple" aria-hidden="true"></div><div class="label">purple</div></div>
      <div class="tile"><div class="cop-lightfield cop-lf--spotlight" aria-hidden="true"></div><div class="label">spotlight</div></div>
    </div>
  </main>
</body>
</html>

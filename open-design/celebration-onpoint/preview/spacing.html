<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celebration OnPoint spacing</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-12) var(--space-6); }
    h1 { font-family: var(--font-display); font-size: var(--text-2xl); letter-spacing: var(--tracking-display); }
    .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; margin-block: var(--space-8); }
    .bar { background: #1056a5; border-radius: var(--radius-sm); }
    .label { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-2); }
    .radii { display: flex; gap: var(--space-5); flex-wrap: wrap; }
    .r { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--elev-raised); width: 96px; height: 96px; display: grid; place-items: center; font-size: var(--text-xs); color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Spacing and radii</h1>
    <div class="row">
      <div><div class="bar" style="width:var(--space-1);height:var(--space-1)"></div><div class="label">1 · 4</div></div>
      <div><div class="bar" style="width:var(--space-2);height:var(--space-2)"></div><div class="label">2 · 8</div></div>
      <div><div class="bar" style="width:var(--space-3);height:var(--space-3)"></div><div class="label">3 · 12</div></div>
      <div><div class="bar" style="width:var(--space-4);height:var(--space-4)"></div><div class="label">4 · 16</div></div>
      <div><div class="bar" style="width:var(--space-6);height:var(--space-6)"></div><div class="label">6 · 24</div></div>
      <div><div class="bar" style="width:var(--space-8);height:var(--space-8)"></div><div class="label">8 · 32</div></div>
      <div><div class="bar" style="width:var(--space-12);height:var(--space-12)"></div><div class="label">12 · 48</div></div>
    </div>
    <div class="radii">
      <div class="r" style="border-radius:var(--radius-sm)">sm 6</div>
      <div class="r" style="border-radius:var(--radius-md)">md 10</div>
      <div class="r" style="border-radius:var(--radius-lg)">lg 16</div>
      <div class="r" style="border-radius:var(--radius-pill);width:160px">pill</div>
    </div>
  </main>
</body>
</html>

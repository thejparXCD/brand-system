<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.CelebrationOnPointDesignSystem_2fb49a;
    const Search = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const Arrow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    function Demo() {
      return (
        <div>
          <div className="lbl">Buttons</div>
          <div className="group">
            <Button variant="primary" iconRight={<Arrow/>}>See more</Button>
            <Button variant="secondary">Book a session</Button>
            <Button variant="outline">Learn how</Button>
            <Button variant="ghost">Cancel</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
          <div className="group">
            <Button variant="secondary" size="sm">Small</Button>
            <Button variant="secondary" size="md">Medium</Button>
            <Button variant="secondary" size="lg">Large</Button>
            <IconButton aria-label="Search" variant="outline"><Search/></IconButton>
            <IconButton aria-label="Next" variant="solid" round><Arrow/></IconButton>
          </div>
          <div className="cols">
            <div className="stack">
              <Input label="Work email" placeholder="you@company.com" iconLeft={<Search/>} />
              <Select label="Service line" placeholder="Choose one" options={['Technology & Infrastructure','Growth & Workforce','Mission Strategy & Readiness','Not sure yet']} />
            </div>
            <div className="stack">
              <div className="stack" style={{gap:10}}>
                <Checkbox label="Weekly momentum brief" defaultChecked />
                <Radio name="p" label="Reality Audit" defaultChecked />
                <Radio name="p" label="Momentum System" />
                <Switch label="Live tracking" defaultChecked />
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>

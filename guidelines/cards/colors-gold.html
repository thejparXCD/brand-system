<!-- @dsCard group="Colors" viewport="700x150" name="Gold Momentum" subtitle="The OnPoint bolt — primary accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 78px; }
  .meta { padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; }
  .meta b { display: block; font-weight: 600; color: var(--text-strong); }
  .meta span { color: var(--text-faint); }
  .grad { flex: 1.4; border-radius: var(--radius-md); background: var(--grad-bolt); display: flex; align-items: flex-end; padding: 10px; color: var(--c-ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:var(--c-gold)"></div><div class="meta"><b>Gold</b><span>#F5C518</span></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-gold-warm)"></div><div class="meta"><b>Warm</b><span>#F9A02A</span></div></div>
  <div class="sw"><div class="chip" style="background:var(--c-gold-deep)"></div><div class="meta"><b>Deep</b><span>#E8920C</span></div></div>
  <div class="grad">--grad-bolt</div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="1.250 major-third ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 110px; flex: none; }
  .spec { font-family: var(--font-display); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="row"><span class="name">display · 67</span><span class="spec" style="font-size:34px">Momentum</span></div>
  <div class="row"><span class="name">h1 · 50</span><span class="spec" style="font-size:28px">See more</span></div>
  <div class="row"><span class="name">h2 · 38</span><span class="spec" style="font-size:23px">Sell more</span></div>
  <div class="row"><span class="name">h3 · 28</span><span class="spec" style="font-size:19px">Operate smarter</span></div>
  <div class="row"><span class="name">base · 16</span><span class="spec" style="font-size:16px;font-family:var(--font-body)">Message · Machines · Mission</span></div>
  <div class="row"><span class="name">xs · 12</span><span class="spec" style="font-size:12px;font-family:var(--font-mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--c-azure)">Eyebrow label</span></div>
</body>
</html>

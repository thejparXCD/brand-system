<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base unit" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--grad-momentum); border-radius: var(--radius-xs); width: 100%; }
  .item span { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .item b { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="item" style="width:16px"><div class="bar" style="height:16px"></div><b>1</b><span>4</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:24px"></div><b>2</b><span>8</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:32px"></div><b>3</b><span>12</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:40px"></div><b>4</b><span>16</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:52px"></div><b>6</b><span>24</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:64px"></div><b>8</b><span>32</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:80px"></div><b>12</b><span>48</span></div>
  <div class="item" style="width:16px"><div class="bar" style="height:96px"></div><b>16</b><span>64</span></div>
</body>
</html>

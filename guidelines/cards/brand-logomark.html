<!-- @dsCard group="Brand" viewport="700x180" name="Logomark" subtitle="The C + gold momentum bolt, on light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .panel { border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; gap: 14px; height: 138px; }
  .light { background: var(--n-50); border: 1px solid var(--border-subtle); }
  .dark { background: var(--c-ink); }
  .emblem { background: var(--grad-mission); }
  .panel img { height: 84px; width: auto; display: block; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup .wm { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-size: 19px; }
  .lockup .wm small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <div class="panel light">
    <div class="lockup">
      <img src="../../assets/logo-mark.png" alt="Celebration OnPoint mark">
      <div class="wm" style="color:var(--text-strong)">Celebration<br>OnPoint<small style="color:var(--c-azure)">Asymmetric Advantage</small></div>
    </div>
  </div>
  <div class="panel dark">
    <div class="lockup">
      <img src="../../assets/logo-mark.png" alt="">
      <div class="wm" style="color:#fff">Celebration<br>OnPoint<small style="color:var(--c-gold)">Asymmetric Advantage</small></div>
    </div>
  </div>
  <div class="panel emblem"><img src="../../assets/logo-mark.png" alt=""></div>
</body>
</html>

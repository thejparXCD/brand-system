<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .g { height: 104px; border-radius: var(--radius-lg); display: flex; align-items: flex-end; padding: 12px; box-shadow: var(--shadow-md); }
  .g b { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <div class="g" style="background:var(--grad-c)"><b style="color:#fff">--grad-c</b></div>
  <div class="g" style="background:var(--grad-bolt)"><b style="color:var(--c-ink)">--grad-bolt</b></div>
  <div class="g" style="background:var(--grad-momentum)"><b style="color:#fff">--grad-momentum</b></div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x150" name="Mono & Eyebrow — IBM Plex Mono" subtitle="Labels, data, eyebrows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-azure); }
  .data { font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
  .data span { color: var(--c-gold-deep); }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="eyebrow">Mission Strategy &amp; Readiness</div>
  <div class="data">+38.4% <span>momentum</span></div>
  <div class="tag">IBM Plex Mono · used for eyebrows, metrics, code, table data</div>
</body>
</html>

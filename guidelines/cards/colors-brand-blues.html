<!-- @dsCard group="Colors" viewport="700x150" name="Brand Blues" subtitle="The C — sky-cyan down to deep navy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; line-height: 1.45; }
  .meta b { display: block; font-weight: 600; color: var(--text-strong); font-size: 11px; }
  .meta span { color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--c-sky)"></div><div class="meta"><b>Sky</b><span>#59C4E5</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--c-azure)"></div><div class="meta"><b>Azure</b><span>#2896D2</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--c-blue)"></div><div class="meta"><b>Blue</b><span>#1056A5</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--c-blue-deep)"></div><div class="meta"><b>Deep</b><span>#0E2A6B</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--c-navy)"></div><div class="meta"><b>Navy</b><span>#081E42</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--c-ink)"></div><div class="meta"><b>Ink</b><span>#0A0814</span></div></div>
  </div>
</body>
</html>
